name: Build unsigned iOS IPA

# 只手动触发，避免浪费 GitHub 的 macOS 分钟数
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle identifier (any unique value works for unsigned builds)'
        required: false
        default: 'com.pkhexmaui.ios'

jobs:
  build-ios-unsigned:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固定 SDK / workload / Xcode 组合：10.0.401 + workload 10.0.401 + Xcode 26.6
      # 这组版本已在 macos-26 runner 上验证过可以产出无签名 ipa
      - name: Install .NET 10.0.401
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --version 10.0.401 --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      # 关键：runner 上还有 .NET 11，必须用 global.json 钉住 10.0.401，
      # 否则 workload install 会把 10 的 manifest 装进 11.0.100 版本带并冲突
      - name: Verify pinned SDK
        run: |
          SELECTED=$(dotnet --version)
          echo "Selected SDK: $SELECTED"
          dotnet --list-sdks
          if [ "$SELECTED" != "10.0.401" ]; then
            echo "::error::Expected SDK 10.0.401 but got $SELECTED. Make sure global.json is in the repo root."
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

      # 仓库根目录有多个 csproj/slnx，workload install 在当前目录探测项目会报 MSB1011。
      # 改到 .github/workflows 下执行：这里没有项目文件，但仍会向上找到根目录的 global.json。
      - name: Install MAUI workload
        working-directory: .github/workflows
        run: dotnet workload install maui --version 10.0.401

      - name: Verify toolchain
        run: |
          dotnet --version
          dotnet workload list
          dotnet workload --info

      # 中文化：把 XAML/C# 中的英文界面文本替换为中文（localization 目录随仓库提交）
      - name: Apply Chinese localization
        run: python3 localization/apply_zh.py

      # 覆盖 TargetFrameworks，防止 macOS 上尝试构建 windows 目标导致 NETSDK1100
      - name: Restore iOS target only
        run: dotnet restore PKHeX.MAUI.csproj -p:TargetFrameworks=net10.0-ios

      # PKHeX 大量使用反射，Release 默认 AOT + 裁剪会失败；用解释器 + TrimMode=copy 绕开。
      # iOS 上不能用 PublishTrimmed=false，必须用 TrimMode=copy。
      # 注意：ArchiveOnBuild=true 会强制要求签名，无签名构建必须关掉，只产出 .app。
      - name: Publish unsigned app
        run: |
          dotnet publish PKHeX.MAUI.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            -p:TargetFrameworks=net10.0-ios \
            -p:ApplicationId=${{ inputs.bundle_id }} \
            -p:UseInterpreter=true \
            -p:MtouchInterpreter=all \
            -p:TrimMode=copy \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false

      # 手动把 .app 按 IPA 标准结构打包：Payload/<App>.app -> unsigned.ipa
      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          PUBLISH_DIR="bin/Release/net10.0-ios/ios-arm64/publish"
          echo "Publish output:"
          ls -la "$PUBLISH_DIR"
          EXISTING_IPA=$(find "$PUBLISH_DIR" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -n "$EXISTING_IPA" ]; then
            cp "$EXISTING_IPA" unsigned.ipa
          else
            APP_DIR=$(find "$PUBLISH_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)
            if [ -z "$APP_DIR" ]; then
              echo "::error::No .app bundle found in $PUBLISH_DIR"
              exit 1
            fi
            echo "App bundle: $APP_DIR"
            rm -rf Payload unsigned.ipa
            mkdir -p Payload
            cp -R "$APP_DIR" Payload/
            zip -q -r unsigned.ipa Payload
          fi
          ls -lh unsigned.ipa
          file unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PKHeXMAUI-unsigned-ios-zh
          path: unsigned.ipa
          if-no-files-found: error
          retention-days: 7
