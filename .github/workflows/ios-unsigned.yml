name: Build unsigned iOS IPA

# 只手动触发，避免浪费 GitHub 的 macOS 分钟数
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle identifier (any unique value works for unsigned builds)'
        required: false
        default: 'com.pkhexmaui.ios'
      diagnostic_mode:
        description: '诊断模式：把 AppShell 换成简单 Hello 页面，判断黑屏是否由 Shell 渲染引起'
        type: boolean
        required: false
        default: false

jobs:
  build-ios-unsigned:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 内联生成 global.json，无需单独上传该文件
      - name: Setup global.json (pin SDK 11.0.100)
        run: |
          cat > global.json <<'GLOBAL_EOF'
          {
            "sdk": {
              "version": "11.0.100",
              "rollForward": "disable"
            }
          }
          GLOBAL_EOF

      # .NET 11 GA（CoreCLR 运行时）+ 自动配套 workload + runner 默认 Xcode
      # CoreCLR 内置解释器，不依赖 JIT，有望解决 iOS 26 上 Mono 解释器失效的黑屏问题
      - name: Install .NET 11.0.100
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --version 11.0.100 --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      # 关键：用 global.json 钉住 11.0.100，避免 CLI 挑到 runner 上更高版本导致 manifest 版本带冲突
      - name: Verify pinned SDK
        run: |
          SELECTED=$(dotnet --version)
          echo "Selected SDK: $SELECTED"
          dotnet --list-sdks
          if [ "$SELECTED" != "11.0.100" ]; then
            echo "::error::Expected SDK 11.0.100 but got $SELECTED. Make sure global.json is in the repo root."
            exit 1
          fi

      - name: Check Xcode
        run: |
          echo "Available Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "Current:"
          xcodebuild -version

      # 仓库根目录有多个 csproj/slnx，workload install 在当前目录探测项目会报 MSB1011。
      # 改到 .github/workflows 下执行：这里没有项目文件，但仍会向上找到根目录的 global.json。
      - name: Install MAUI workload
        working-directory: .github/workflows
        run: dotnet workload install maui

      - name: Verify toolchain
        run: |
          dotnet --version
          dotnet workload list
          dotnet workload --info

      # 关键修复：iOS 26 上 MAUI Shell 渲染黑屏（dotnet/maui#31982）。
      # 加入 UIDesignRequiresCompatibility 让 App 回退到旧版 UI 渲染模式。
      - name: Patch Info.plist for iOS 26 Shell rendering
        run: |
          PLIST="Platforms/iOS/Info.plist"
          if ! grep -q "UIDesignRequiresCompatibility" "$PLIST"; then
            /usr/libexec/PlistBuddy -c "Add :UIDesignRequiresCompatibility bool true" "$PLIST"
          fi
          echo "===== Info.plist 关键项 ====="
          /usr/libexec/PlistBuddy -c "Print :UIDesignRequiresCompatibility" "$PLIST"

      # 中文化：脚本与字典内联在 workflow 中，无需在仓库单独放 localization 目录
