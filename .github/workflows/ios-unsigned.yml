          JSON_EOF
          cat > localization/apply_zh.py <<'PY_EOF'
          # -*- coding: utf-8 -*-
          """
          PKHeX MAUI 中文化脚本
          在 CI 中于 dotnet publish 之前运行，把 XAML/C# 中的英文界面文本替换为中文。
          - 按 translations.json 精确匹配，不碰代码逻辑、变量名、绑定表达式。
          - 对 AppShell.xaml.cs 依赖的 3 个 Title 值豁免（Box/Party、pk editor、File），
            因为代码用它们判断 Flyout 模板，翻译会破坏菜单渲染。
          """
          import json
          import os
          import re
          import sys
          
          ROOT = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          DICT_PATH = os.path.join(ROOT, "localization", "translations.json")
          
          with open(DICT_PATH, encoding="utf-8") as fp:
              TRANS = json.load(fp)
          
          # 这些 Title 值被 AppShell.xaml.cs 用于逻辑判断，必须保留英文
          TITLE_EXEMPT = {"Box/Party", "pk editor", "File"}
          
          # XAML 中需要翻译的属性
          XAML_ATTRS = ("Text", "Title", "Placeholder")
          # C# 中需要翻译的 .Text = "..." 赋值
          CS_TEXT_RE = re.compile(r'(\.Text\s*=\s*")([^"{}]+)(")')
          
          stats = {"xaml_files": 0, "xaml_replacements": 0, "cs_files": 0, "cs_replacements": 0, "skipped": 0}
          
          
          def apply_xaml(path):
              with open(path, encoding="utf-8-sig") as fp:
                  src = fp.read()
              result = src
              n = 0
              skipped = 0
          
              # 逐属性匹配：attr="value"，value 内不含双引号
              for attr in XAML_ATTRS:
                  pat = re.compile(r'(\b' + re.escape(attr) + r'=")([^"]*)(")')
          
                  def repl(m):
                      nonlocal n, skipped
                      prefix, value, suffix = m.group(1), m.group(2), m.group(3)
                      if "{" in value:  # 绑定 / StaticResource 表达式，跳过
                          return m.group(0)
                      # 字典 key 即原始文本（含菜单缩进空格），直接精确匹配
                      if value not in TRANS:
                          return m.group(0)
                      # Title 豁免：这些值被代码用于判断
                      if attr == "Title" and value.strip() in TITLE_EXEMPT:
                          skipped += 1
                          return m.group(0)
                      n += 1
                      return prefix + TRANS[value] + suffix
          
                  result = pat.sub(repl, result)
          
              if result != src:
                  with open(path, "w", encoding="utf-8") as fp:
                      fp.write(result)
                  stats["xaml_files"] += 1
              stats["xaml_replacements"] += n
              stats["skipped"] += skipped
          
          
          def apply_cs(path):
              with open(path, encoding="utf-8-sig") as fp:
                  src = fp.read()
              result = src
              n = 0
          
              def repl(m):
                  nonlocal n
                  value = m.group(2)
                  if value not in TRANS:
                      return m.group(0)
                  n += 1
                  return m.group(1) + TRANS[value] + m.group(3)
          
              result = CS_TEXT_RE.sub(repl, result)
              if result != src:
                  with open(path, "w", encoding="utf-8") as fp:
                      fp.write(result)
                  stats["cs_files"] += 1
              stats["cs_replacements"] += n
          
          
          for dirpath, dirnames, filenames in os.walk(ROOT):
              dirnames[:] = [d for d in dirnames if d not in (".git", "localization", "bin", "obj")]
              for name in filenames:
                  path = os.path.join(dirpath, name)
                  if name.endswith(".xaml"):
                      apply_xaml(path)
                  elif name.endswith(".cs") and "Platforms" not in path:
                      apply_cs(path)
          
          print("=== 汉化完成 ===")
          print(f"XAML 文件修改: {stats['xaml_files']}, 替换: {stats['xaml_replacements']}")
          print(f"C# 文件修改: {stats['cs_files']}, 替换: {stats['cs_replacements']}")
          print(f"Title 豁免（逻辑依赖，保留英文）: {stats['skipped']}")
          PY_EOF
          python3 localization/apply_zh.py

      # 诊断模式：在 CreateWindow 开头插入 early return，绕过 AppShell 直接显示简单页面。
      # 能显示文字 = Shell 渲染问题；仍黑屏 = 更底层的运行时/解释器问题。
      - name: Apply diagnostic page (optional)
        if: ${{ inputs.diagnostic_mode }}
        run: |
          python3 - <<'DIAG_EOF'
          p = 'App.xaml.cs'
          s = open(p, encoding='utf-8-sig').read()
          marker = 'protected override Window CreateWindow(IActivationState? activationState)\n    {'
          if marker not in s:
              raise SystemExit('CreateWindow marker not found')
          injection = marker + '''
              var diagLabel = new Label
              {
                  Text = "DIAG OK - render works",
                  HorizontalOptions = LayoutOptions.Center,
                  VerticalOptions = LayoutOptions.Center,
                  FontSize = 30,
                  TextColor = Colors.Black
              };
              var diagPage = new ContentPage
              {
                  Content = new Grid { Children = { diagLabel } },
                  BackgroundColor = Colors.White
              };
              return new Window(diagPage);'''
          s = s.replace(marker, injection, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('diagnostic early-return injected')
          DIAG_EOF

      # .NET 11 用 CoreCLR 运行时（内置解释器 + ReadyToRun），不需要 Mono 的 UseInterpreter/MtouchInterpreter。
      # 把 csproj 里所有 net10.0 TFM 改成 net11.0，让条件 PropertyGroup 也能匹配。
      - name: Retarget to .NET 11
        run: |
          python3 - <<'TFM_EOF'
          p = 'PKHeX.MAUI.csproj'
          s = open(p, encoding='utf-8-sig').read()
          n = s.count('net10.0')
          s = s.replace('net10.0', 'net11.0')
          open(p, 'w', encoding='utf-8').write(s)
          print(f'replaced {n} net10.0 -> net11.0')
          TFM_EOF
          grep -n "TargetFrameworks" PKHeX.MAUI.csproj | head -3

      - name: Restore iOS target
        run: dotnet restore PKHeX.MAUI.csproj -p:TargetFrameworks=net11.0-ios

      # CoreCLR：不需要 AOT、不需要 Mono 解释器参数、不需要 TrimMode。
      # ArchiveOnBuild=true 强制要求签名，无签名构建必须关掉，只产出 .app。
      - name: Publish unsigned app (CoreCLR / .NET 11)
        run: |
          dotnet publish PKHeX.MAUI.csproj \
            -c Release \
            -f net11.0-ios \
            -r ios-arm64 \
            -p:TargetFrameworks=net11.0-ios \
            -p:ApplicationId=${{ inputs.bundle_id }} \
            -p:ValidateXcodeVersion=false \
            -p:EnableCodeSigning=false \
            -p:ArchiveOnBuild=false
          echo "::notice::.NET 11 CoreCLR 构建完成。"

      # 手动把 .app 按 IPA 标准结构打包：Payload/<App>.app -> unsigned.ipa
      - name: Pack unsigned IPA
        run: |
          set -euo pipefail
          PUBLISH_DIR="bin/Release/net11.0-ios/ios-arm64/publish"
          echo "Publish output:"
          ls -la "$PUBLISH_DIR"
          EXISTING_IPA=$(find "$PUBLISH_DIR" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -n "$EXISTING_IPA" ]; then
            echo "Found existing IPA from publish: $EXISTING_IPA"
            cp "$EXISTING_IPA" unsigned.ipa
          else
            APP_DIR=$(find "$PUBLISH_DIR" -maxdepth 1 -name '*.app' -type d -print -quit)
            if [ -z "$APP_DIR" ]; then
              echo "::error::No .app bundle found in $PUBLISH_DIR"
              exit 1
            fi
            echo "App bundle: $APP_DIR"
            echo "===== 诊断：.app 结构 ====="
            echo "-- 顶层 --"
            ls -la "$APP_DIR" | head -40
            echo "-- 符号链接 --"
            find "$APP_DIR" -type l -print | head -40
            echo "-- framework/dylib --"
            find "$APP_DIR" \( -name '*.framework' -o -name '*.dylib' \) -print | head -60
            echo "-- 主可执行文件 --"
            EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_DIR/Info.plist" 2>/dev/null || echo "")
            echo "CFBundleExecutable=$EXE"
            if [ -n "$EXE" ]; then
              file "$APP_DIR/$EXE"
              codesign -dv "$APP_DIR/$EXE" 2>&1 | head -20 || echo "（未签名）"
            fi
            echo "-- entitlements --"
            find "$APP_DIR" -name '*.entitlements' -print | head
            echo "===== 诊断结束 ====="

            # 关键修复：EnableCodeSigning=false 让所有 dylib 都未签名，SideStore 重签只签主程序，
            # 内部 dylib 未签名会导致 dyld 加载失败、启动即黑屏。这里做 ad-hoc 深度签名补齐。
            echo "===== ad-hoc 深度签名 ====="
            find "$APP_DIR" -type f \( -name '*.dylib' -o -perm -111 \) -print | while read -r f; do
              if file "$f" | grep -q 'Mach-O'; then
                codesign -s - --force "$f" 2>/dev/null || echo "  跳过: $f"
              fi
            done
            codesign -s - --force --deep "$APP_DIR" 2>&1 | head -20 || echo "  主包签名警告"
            echo "-- 签名验证 --"
            codesign -vvv --deep --strict "$APP_DIR" 2>&1 | head -20 || echo "  (ad-hoc 验证提示)"

            rm -rf Payload unsigned.ipa
            mkdir -p Payload
            # ditto 保留符号链接、文件权限与扩展属性；比 cp -R + zip 更适合含 framework 的 .app
            ditto "$APP_DIR" "Payload/$(basename "$APP_DIR")"
            # -y 保留符号链接
            zip -q -r -y unsigned.ipa Payload
          fi
          ls -lh unsigned.ipa
          file unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PKHeXMAUI-zh-net11-coreclr
          path: unsigned.ipa
          if-no-files-found: error
          retention-days: 7
